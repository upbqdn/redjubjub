[package]
name = "redjubjub"
edition = "2021"
rust-version = "1.88"
# When releasing to crates.io:
# - Update CHANGELOG.md
# - Create git tag.
version = "0.9.0"
authors = ["Henry de Valence <hdevalence@hdevalence.ca>", "Deirdre Connolly <durumcrustulum@gmail.com>", "Chelsea Komlo <me@chelseakomlo.com>", "Daira-Emma Hopwood <daira@jacaranda.org>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZcashFoundation/redjubjub"
categories = ["cryptography"]
keywords = ["cryptography", "crypto", "jubjub", "redjubjub", "zcash"]
description = "A standalone implementation of the RedJubjub signature scheme."

[package.metadata.docs.rs]
features = ["nightly"]

[dependencies]
reddsa = { version = "0.6.1", default-features = false, features = ["alloc"] }
jubjub = { version = "0.11", default-features = false }
rand_core = { version = "0.10", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["zeroize_derive"] }

[dev-dependencies]
bincode = "1"
criterion = "0.5"
lazy_static = "1.4"
proptest = "1.0"
rand = "0.10"
rand_chacha = "0.10"
serde_json = "1.0"

[features]
nightly = []
default = ["serde", "std", "zeroize"]
serde = ["dep:serde", "reddsa/serde"]
std = ["thiserror/std", "reddsa/std"]
zeroize = ["reddsa/zeroize"]

[[bench]]
name = "bench"
harness = false

[patch.crates-io]
reddsa = { git = "https://github.com/ZcashFoundation/reddsa", rev = "6cc0415f322c199442e767b6bbb30b42469d927c" }
pasta_curves = { git = "https://github.com/upbqdn/pasta_curves", rev = "b80bd85008f73f971dc689b1a30e5551e1e957d1" }
